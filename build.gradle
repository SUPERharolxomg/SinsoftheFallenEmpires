plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 1.20.1 runs on Java 17, so the mod targets Java 17
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    // Required for resources to be available when launching from the IDE
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            // Dependencies with mixins (Curios, GeckoLib) ship SRG refmaps; remap them to dev names
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            // ./gradlew runClient -PshotSets=solari,berserker opens the world run/saves/shots, dresses the player
            // in each armor set and screenshots it, then quits (ArmorShots)
            if (project.hasProperty('shotSets')) {
                property 'sofe.armorShots', project.property('shotSets')
                args '--quickPlaySingleplayer', 'shots'
            }
            // ./gradlew runClient -PskillShots=all (or skill ids): casts each skill on zombies, screenshots it,
            // writes run/skillshots.log, then quits (SkillShots)
            // ./gradlew runClient -PplaceShots=parsivan/baths,aureum/colosseum builds each story place in run/saves/shots_aetheris,
            // screenshots it from above and from its door, then quits (PlaceShots)
            // ./gradlew runClient -PdeathCheck: the player dies, comes back, presses the skill tree and character keys;
            // run/deathcheck.log tells what opened (DeathKeysCheck)
            // ./gradlew runClient -PprotectCheck: in creative and as an operator, tries to take things from Sulthari;
            // run/protectcheck.log tells what held (ProtectCheck)
            if (project.hasProperty('protectCheck')) {
                property 'sofe.protectCheck', 'true'
                args '--quickPlaySingleplayer', 'shots_aetheris'
            }
            if (project.hasProperty('deathCheck')) {
                property 'sofe.deathCheck', 'true'
                args '--quickPlaySingleplayer', 'shots_aetheris'
            }
            if (project.hasProperty('placeShots')) {
                property 'sofe.placeShots', project.property('placeShots')
                args '--quickPlaySingleplayer', 'shots_aetheris'
            }
            if (project.hasProperty('skillShots')) {
                property 'sofe.skillShots', project.property('skillShots')
                if (project.hasProperty('companion')) property 'sofe.companion', project.property('companion')
                args '--quickPlaySingleplayer', 'shots'
            }
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // Starts a server, runs every registered GameTest and exits (used in CI)
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroupByRegex('software\\.bernie.*') }
    }
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup('top.theillusivec4.curios') }
    }
    maven {
        name = 'JEI'
        url = 'https://maven.blamejared.com'
        content { includeGroup('mezz.jei') }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup('curse.maven') }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Animated bosses, Broken Oaths, Bearers and summons
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")

    // Amulet, rings and potion belt slots
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")

    // Furniture for the interiors of the cities (MrCrayfish, MIT), placed by id, so only needed at runtime
    runtimeOnly fg.deobf("curse.maven:refurbished-furniture-897116:${furniture_file}")
    runtimeOnly fg.deobf("curse.maven:framework-549225:${framework_file}")

    // Flags, sconces and decorations (Supplementaries and its library Moonlight), and ships that sail (Small Ships)
    runtimeOnly fg.deobf("curse.maven:supplementaries-412082:${supplementaries_file}")
    runtimeOnly fg.deobf("curse.maven:moonlight-499980:${moonlight_file}")
    runtimeOnly fg.deobf("curse.maven:small-ships-450659:${smallships_file}")

    // In the pack: JEI (recipes of every item, the stations' recipes included) and Xaero's Minimap
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}") { transitive = false } // the mod jar holds its libraries
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}") { transitive = false } // the mod jar holds its libraries
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}") { transitive = false } // the mod jar holds its libraries
    runtimeOnly fg.deobf("curse.maven:xaeros-minimap-263420:${xaero_minimap_file}")

    // Unit tests for pure game logic (no Minecraft classes)
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            geckolib_version: geckolib_version, curios_version: curios_version,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
