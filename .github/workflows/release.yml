name: Release

# Push a tag like v0.8.2 (matching mod_version in gradle.properties) to build,
# test and publish the jar to CurseForge and GitHub Releases.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag matches mod_version
        run: |
          MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          if [ "v$MOD_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match mod_version=$MOD_VERSION"
            exit 1
          fi
          echo "MOD_VERSION=$MOD_VERSION" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and unit tests
        run: |
          chmod +x gradlew
          ./gradlew build --console=plain

      - name: GameTests
        # Canary breaks the GameTest framework clearing a test plot now and then (a crash in LevelTicks.clearArea)
        run: ./gradlew runGameTestServer -PnoPerfMods=canary --console=plain

      - name: Changelog from commits since the previous tag
        run: |
          PREV=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then RANGE="$PREV..$GITHUB_REF_NAME"; else RANGE="-n 15 $GITHUB_REF_NAME"; fi
          git log $RANGE --no-merges --pretty='- %s' | grep -v '^- release:' > changelog.md || true
          cat changelog.md

      - name: Publish to CurseForge and GitHub
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1730353
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

          files: build/libs/sofe-${{ env.MOD_VERSION }}.jar
          name: Sins of the Fallen Empires ${{ env.MOD_VERSION }}
          version: ${{ env.MOD_VERSION }}
          version-type: beta
          changelog-file: changelog.md

          loaders: forge
          game-versions: 1.20.1
          java: 17

          dependencies: |
            geckolib(required){curseforge:geckolib}
            curios(required){curseforge:curios}
            supplementaries(required){curseforge:supplementaries}
            smallships(required){curseforge:small-ships}
            refurbished_furniture(required){curseforge:refurbished-furniture}
